<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>8OLLAR Tap</title>
  <!-- Подключаем стили с хэшем версий против кэша -->
  <link rel="stylesheet" href="/static/style.css?v=999">
  <!-- Telegram WebApp API -->
  <script src="https://telegram.org"></script>
</head>
<body>
  <!-- Фирменная неоновая рамка вокруг всего экрана -->
  <div class="neon"></div>

  <!-- Главный контейнер игры -->
  <div class="container">
    <div class="header">
      <div class="score-box">
        <span class="currency-label">8OLLAR</span>
        <h1 id="dollars">0.00</h1>
      </div>
      <div class="energy-box">
        ⚡ <span id="energy">100</span> / <span id="max-energy">100</span>
      </div>
    </div>

    <!-- Область индикации кулдауна -->
    <div id="cooldown-indicator" class="cooldown-ready">
      STATUS: <span id="cooldown-time">READY</span>
    </div>

    <!-- Основная кликабельная зона кнопки -->
    <div id="tap-area">
      <button id="tap-button" class="ready">
        <div class="tap-inner">TAP</div>
      </button>
    </div>

    <!-- Слои для анимаций вылетающих цифр дохода -->
    <div id="float-layer"></div>
    <div id="bonus-layer"></div>

    <!-- Нижнее фиксированное меню навигации (Чётко внутри рамки .neon) -->
    <div class="bottom">
      <button data-panel="upgrades">⚙️ Апгрейды</button>
      <button data-panel="gems">💎 G3MS</button>
      <button data-panel="rating">🏆 Топ</button>
      <button data-panel="profile">👤 Профиль</button>
    </div>
  </div>

  <!-- Всплывающее окно (Универсальная шторка) -->
  <div id="panel" class="panel">
    <button id="close-panel">✕</button>
    <div id="panel-content"></div>
  </div>

  <!-- Всплывающие уведомления (Тосты) -->
  <div id="toast"></div>

  <!-- Подключаем архитектуру скриптов (Разбиваем нагрузку, сбрасываем мобильный кэш) -->
  <script src="/static/core.js?v=999"></script>
  <script src="/static/game.js?v=999"></script>
  <script src="/static/ui.js?v=999"></script>
</body>
</html>
